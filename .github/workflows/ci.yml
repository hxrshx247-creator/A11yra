name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            reader/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: node frontend/scripts/check-glob-security.mjs
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: reader
      - run: npx playwright-core install --with-deps chromium
        working-directory: reader
      - run: node reader/run-browser-tests.mjs
        env:
          A11YRA_PYTHON: python
      - run: node frontend/scripts/check-contrast.mjs
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: a11yra
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: a11yra
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U a11yra" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://a11yra:ci-only@127.0.0.1:5432/a11yra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m alembic -c backend/alembic.ini check
  dependency-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.txt
      - run: npm audit --prefix frontend --audit-level=high
      - run: npm audit --prefix reader --audit-level=high
  compose-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: docker compose up --build --wait
        env:
          VITE_SHOW_ADVANCED: "true"
      - name: Show API startup logs on failure
        if: failure()
        run: docker compose logs --no-color api
      - run: docker compose exec -T api alembic check
      - run: >
          docker compose exec -T api sh -c
          'python -m venv --system-site-packages /tmp/a11yra-tests &&
          /tmp/a11yra-tests/bin/python -m pip install -r requirements-dev.txt &&
          A11YRA_TEST_POSTGRES_URL="$DATABASE_URL" /tmp/a11yra-tests/bin/python -m pytest -q'
      - run: npm ci --prefix reader
      - run: npx --prefix reader playwright-core install --with-deps chromium
      - run: node --test reader/test-product.mjs
      - run: docker compose down -v
        if: always()
